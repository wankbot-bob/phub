[tool.poetry]
name = "phub"
version = "0.1.0"
description = "Python port of the PornHub.js scraping and WebMaster API client."
authors = ["PHub Maintainers"]
license = "MIT"
readme = "README.md"
packages = [{ include = "phub" }]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
requests = ">=2.31.0"
beautifulsoup4 = ">=4.12.0"
lxml = ">=4.9.0"
yt-dlp = ">=2024.11.4"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
ruff = "^0.1.0"
mypy = "^1.6.0"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
